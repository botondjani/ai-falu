# Render Blueprint: Render → New → Blueprint → ez a repó.
# A titkos értékeket (GEMINI_API_KEY, SIM_PASSWORD) a Render kéri be telepítéskor; a kódba nem kerülnek.
services:
  - type: web
    name: ai-falu
    runtime: docker
    plan: starter # a fizetős csomag nem alszik el, és lehet hozzá tartós lemez
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SIM_PASSWORD
        sync: false
      - key: SIM_DB
        value: /data/falu.db
      - key: SIM_SECONDS_PER_DAY
        value: "3600" # 1 szimulált nap = 1 óra
      - key: LLM_MAX_USD_PER_DAY
        value: "1"
      - key: LLM_ON_BUDGET
        value: autopilot # a napi keret után LLM nélkül fut tovább
    disk:
      name: falu-data
      mountPath: /data
      sizeGB: 1
